name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Review dependency advisories
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Audit admin authorization
        run: npm run check:admin-auth

      - name: Audit secret exposure
        run: npm run check:secrets

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/nivara
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/nivara
        run: npm run db:validate

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: npm run test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
