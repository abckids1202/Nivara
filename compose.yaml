services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nivara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nivara-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nivara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nivara-postgres:
